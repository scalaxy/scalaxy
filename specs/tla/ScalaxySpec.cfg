SPECIFICATION Spec

CONSTANTS
  Nodes = {"n1", "n2", "n3"}
  Keys = {"k1", "k2", "k3"}

INVARIANT
  TypeOK
  DataIntegrity
  DeleteVisible
  AvailabilityUnderSingleFailure
  RecoveryRestoresService
  EncryptionAtRest
  ReplicationFactorTwo

CHECK_DEADLOCK FALSE
\* Justification: closed model over a fixed key set. Once every key is
\* tombstoned no action is enabled -- legitimate quiescence, not a fault.
