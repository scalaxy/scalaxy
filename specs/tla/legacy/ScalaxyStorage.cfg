CONSTANTS
  Nodes = {n1, n2, n3}
  Keys = {k1, k2}
  Values = {v1, v2}
  NumReplicas = 2
  Owner = [k1 |-> n1, k2 |-> n2]
  EncryptionEnabled = TRUE

SPECIFICATION Spec
INVARIANT
  TypeInvariant
  NoDataLoss
  DeleteVisible
  OwnershipConsistency
  ReplicationCompleteness
  EncryptionConsistency
  SummaryValidityImpliesCorrect

CHECK_DEADLOCK FALSE
