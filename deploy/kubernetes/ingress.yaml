# Optional Ingress for the web console.
# Uncomment and adjust the host, then:
#   kubectl apply -f deploy/kubernetes/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scalaxy
  namespace: scalaxy
spec:
  rules:
    - host: scalaxy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scalaxy
                port:
                  number: 80
